<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Radar — Moja : réglages</title>
<style>
  body { max-width: 520px; margin: 40px auto; padding: 0 16px; font: 14px/1.5 system-ui, sans-serif; color: #111827; }
  input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #d1d5db; border-radius: 8px; font: inherit; }
  button { margin-top: 10px; padding: 8px 14px; border-radius: 8px; border: 1px solid #2563eb; background: #2563eb; color: #fff; cursor: pointer; font: inherit; }
  code { background: #f3f4f6; padding: 1px 4px; border-radius: 4px; }
  #result { margin-top: 12px; }
  .ok { color: #047857; } .error { color: #b91c1c; }
</style>
</head>
<body>
  <h1>Radar — Moja</h1>
  <p>Le secret d'import autorise l'extension à envoyer des données à Radar. C'est la valeur <code>INGEST_SECRET</code> de ton fichier <code>.env.local</code>. Il reste stocké dans ce Chrome uniquement.</p>
  <label for="secret">Secret d'import</label>
  <input id="secret" type="password" autocomplete="off" placeholder="Colle le secret ici">
  <button id="save">Enregistrer et tester</button>
  <p id="result"></p>
  <script type="module" src="options.js"></script>
</body>
</html>
